{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 fade-up">
    <div class="card-g">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div style="font-size:3rem;filter:drop-shadow(0 0 15px rgba(99,102,241,.5))">🔐</div>
        <h5 style="font-family:'Sora',sans-serif;font-weight:800;margin-top:.5rem">Change Password</h5>
        <p style="color:#64748b;font-size:.85rem">Keep your account secure</p>
      </div>
      <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label>{{ field.label|upper }}</label>
          {{ field }}
          {% if field.errors %}<div style="color:#f87171;font-size:.78rem;margin-top:.3rem">{{ field.errors.as_text }}</div>{% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn-glow">🔐 Update Password</button>
          <a href="{% url 'profile' %}" class="btn-outline-g text-decoration-none" style="padding:.6rem 1.2rem;display:inline-flex;align-items:center;color:var(--muted)">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
